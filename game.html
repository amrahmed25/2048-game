<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game | Game in Process...</title>
    <link rel="stylesheet" href="game.css">
    <script src="game.js"></script>
</head>
<body>
    <center>
    <h1 id="title">2048!</h1>
    </center>
    <hr>
    
    <h2>Score: <span id="score">0</span></h2>
    <div id="board">
    </div>
    <br>
    <button id="stop-btn" onclick="pauseGame()">Stop</button>
    <div id="pause-menu" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100;">
      <div style="background: white; padding: 30px; border-radius: 10px; text-align: center;">
        <h2>Game Paused</h2>
        <button id="continue-btn" onclick="continueGame()" style="margin: 10px; padding: 10px 20px;">Continue Game</button>
        <button id="end-btn" onclick="endGame()" style="margin: 10px; padding: 10px 20px;">End Game</button>
      </div>
    </div>
</body>
</html>
